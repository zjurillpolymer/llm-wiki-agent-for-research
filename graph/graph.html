    "markdown": "---\ntitle: \"A smart framework to design membranes for organic micropollutants removal\"\ntype: source\ntags: [membranes, water-treatment, machine-learning, mechanism]\nsources: []\nlast_updated: 2026-09-14\ndate: 2025-08-25\nsource_file: s41893-025-01617-6.pdf\n---\n\n## Summary\n\nThis paper presents a data-mechanism-fused molecular representation learning model, [[DMF-MRL]], for understanding and designing polymeric membranes that remove organic micropollutants (OMPs). The model combines molecular fingerprints with physical descriptions from [[XDLVO]] and [[DSPM-DE]], together with multilevel molecular and membrane descriptors. The authors use the model to show that OMP rejection depends on context-dependent functional-group coupling rather than on isolated functional groups alone, and then construct an interaction framework for tailoring [[PolyamideMembranes]].\n\n## Key Claims\n\n- The dataset contains 2,102 entries covering 277 OMPs, 52 membrane types and 40 descriptions. Among four tested algorithms, XGBoost performed best, with a test R2 of 0.881 after optimization and fivefold cross-validation.\n- DMF-MRL outperforms a data-only model without molecular fingerprints and physical-model features, while retaining interpretable feature contributions through SHAP and partial-dependence analyses.\n- Functional-group importance changes when groups are connected to other substructures. In particular, phenyl-containing structures show multigroup coupling in which hydrophobic interaction, molecular size resistance and pi-pi interactions jointly influence rejection.\n- The effect of increasing phenyl-group count is non-monotonic: stronger membrane interaction can reduce rejection, while the simultaneous increase in molecular size can increase size-sieving resistance.\n- The dominant rejection factors differ across membrane and OMP classes. Hydrophobic interaction is especially important for phenyl-hydrophobic OMPs in nanofiltration, size sieving is important for phenyl-hydrophilic OMPs, and Donnan exclusion is important for phenyl-charged OMPs.\n- The proposed design framework uses surface-charge inversion, zwitterionization, charge enhancement, hydrophilicity and pore architecture to tailor membranes for different OMP classes.\n\n## Key Quotes\n\n> The efficiency of removal depends on the influence of functional-group coupling in the molecular structure.\n\n> The data-mechanism co-driven paradigm has the potential to facilitate the development of advanced water-treatment membranes.\n\n## Connections\n\n- [[DanLu]] — First author and contributor to the membrane design study.\n- [[ZhejiangUniversity]] — The study includes researchers from Zhejiang University.\n- [[OrganicMicropollutants]] — Target contaminants whose rejection is modeled.\n- [[DMF-MRL]] — Main model proposed by the paper.\n- [[XDLVO]] — Physical model embedded to represent solute-membrane interaction energy.\n- [[DSPM-DE]] — Physical model embedded to represent size sieving and Donnan/dielectric exclusion.\n- [[PolyamideMembranes]] — Main membrane family studied and modified experimentally.\n- [[PerioGT]] — Related work in this collection that also embeds polymer-domain knowledge into ML.\n\n## Contradictions\n\n- No direct contradiction with the current wiki. The paper qualifies simple rules based on isolated functional groups by showing that molecular context can reverse or change their apparent effect.\n\n## Source Metadata\n\n- DOI: 10.1038/s41893-025-01617-6\n- Journal: Nature Sustainability\n- Publication date: 25 August 2025\n- Authors: Dan Lu, Zihang Zhao, Xinchen Xiang, Tianyu Li, Yifang Geng, Ming Wu, Yangyang Li, Shiying Xu, Chuanqi Zhang, Zhuofan Gao, Jia-Wei Shen, Lijun Liang, Kai Fan, Zhikan Yao and Lin Zhang.\n",

    "markdown": "---\ntitle: \"Periodicity-aware deep learning for polymers\"\ntype: source\ntags: [polymers, deep-learning, graph-learning, self-supervised-learning]\nsources: []\nlast_updated: 2026-09-14\ndate: 2025-11-20\nsource_file: s43588-025-00903-9.pdf\n---\n\n## Summary\n\nThis paper introduces [[PerioGT]], a periodicity-aware graph-transformer framework for polymer representation learning and property prediction. It treats the repeated-unit structure of polymers as a chemical prior and combines periodicity-aware augmentation, contrastive learning, masked node modeling, virtual nodes and learned periodicity prompts. PerioGT achieves strong performance across polymer prediction tasks and is applied to antimicrobial polymer discovery, where predictions are validated experimentally against methicillin-resistant Staphylococcus aureus (MRSA).\n\n## Key Claims\n\n- Polymer periodicity is a fundamental structural feature that is lost when polymers are simplified to isolated repeating units or ordinary small-molecule graphs.\n- PerioGT pre-trains on approximately one million unlabeled virtual polymers. Its self-supervised objectives combine periodicity-aware contrastive learning with masked node modeling.\n- Periodicity-aware augmentation generates multiple repeating-unit views of the same polymer. The model uses these views to learn representations that remain stable under changes in repeating-unit size, arrangement and minor atomic substitutions.\n- The framework uses [[PolymerGraph]] representations with virtual nodes to connect copolymer components and incorporate sample-level conditions such as copolymer type and molecular weight.\n- PerioGT outperforms the compared supervised and self-supervised baselines on the reported downstream tasks. In periodicity analysis, its average similarity between original repeating units and augmentations is 0.84, and its K-nearest-neighbor classification accuracy exceeds 80%, whereas the other self-supervised baselines remain below 40%.\n- For antimicrobial polymer discovery, the authors generate 624 candidates from 12 diacrylates and 52 amines, synthesize and label 150 of them, and select the top 30 predicted candidates. PerioGT reaches an 83% screening success rate, compared with 57% for TransPolymer and 20% for polyBERT.\n- Two lead polymers have a minimum inhibitory concentration of 8 micrograms per millilitre against MRSA. Follow-up assays show strong bacterial killing, membrane-potential disturbance and membrane disruption.\n\n## Key Quotes\n\n> Existing self-supervised learning methods simplify polymers into repeating units and neglect their inherent periodicity.\n\n> Introducing the periodicity prior effectively enhances model performance.\n\n## Connections\n\n- [[YuhuiWu]] — First author and developer of the PerioGT framework.\n- [[JianJi]] — Corresponding senior author and project supervisor.\n- [[ZhejiangUniversity]] — The authors are affiliated with Zhejiang University.\n- [[PerioGT]] — Main model proposed by the paper.\n- [[PolymerPeriodicity]] — Domain prior encoded by the model.\n- [[PolymerGraph]] — Graph construction used to represent polymer structures and conditions.\n- [[ContrastiveLearning]] — One of the principal self-supervised objectives.\n- [[DMF-MRL]] — Related work in this collection that also fuses domain knowledge with ML for polymer and membrane science.\n\n## Contradictions\n\n- No direct contradiction with the current wiki. Both current papers argue that domain-specific structure and mechanism should be represented explicitly rather than left entirely to generic molecular features.\n\n## Source Metadata\n\n- DOI: 10.1038/s43588-025-00903-9\n- Journal: Nature Computational Science\n- Publication date: 20 November 2025\n- Authors: Yuhui Wu, Cong Wang, Xintian Shen, Tianyi Zhang, Peng Zhang and Jian Ji.\n- Code: https://github.com/wuyuhui-zju/PerioGT\n",

function hexToRgba(color, alpha) {
  if (!color) return `rgba(255, 255, 255, ${alpha})`;
  const normalized = color.replace("#", "");
  const value = normalized.length === 3
    ? normalized.split("").map(ch => ch + ch).join("")
    : normalized;
  const intValue = Number.parseInt(value, 16);
  const r = (intValue >> 16) & 255;
  const g = (intValue >> 8) & 255;
  const b = intValue & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function escapeHtml(text) {
  return (text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function stripFrontmatter(markdown) {
  return (markdown || "").replace(/^---\n[\s\S]*?\n---\n?/, "");
}

function renderInlineMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, '<span class="wikilink">[[$1]]</span>');
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return html;
}

function renderMarkdown(markdown) {
  const lines = stripFrontmatter(markdown).split(/\r?\n/);
  const html = [];
  let paragraph = [];
  let listType = null;
  let listItems = [];
  let quoteLines = [];
  let inCodeBlock = false;
  let codeLines = [];

  function flushParagraph() {
    if (!paragraph.length) return;
    html.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
    paragraph = [];
  }

  function flushList() {
    if (!listType || !listItems.length) return;
    const items = listItems.map(item => `<li>${renderInlineMarkdown(item)}</li>`).join("");
    html.push(`<${listType}>${items}</${listType}>`);
    listType = null;
    listItems = [];
  }

  function flushQuote() {
    if (!quoteLines.length) return;
    html.push(`<blockquote>${quoteLines.map(line => renderInlineMarkdown(line)).join("<br>")}</blockquote>`);
    quoteLines = [];
  }

  function flushCode() {
    if (!codeLines.length) {
      html.push("<pre><code></code></pre>");
      return;
    }
    html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
    codeLines = [];
  }

  for (const rawLine of lines) {
    const line = rawLine.replace(/\t/g, "    ");
    const trimmed = line.trim();

    if (trimmed.startsWith("```")) {
      flushParagraph();
      flushList();
      flushQuote();
      if (inCodeBlock) {
        flushCode();
        inCodeBlock = false;
      } else {
        inCodeBlock = true;
      }
      continue;
    }

    if (inCodeBlock) {
      codeLines.push(rawLine);
      continue;
    }

    if (!trimmed) {
      flushParagraph();
      flushList();
      flushQuote();
      continue;
    }

    const headingMatch = trimmed.match(/^(#(1, 6))\s+(.+)$/);
    if (headingMatch) {
      flushParagraph();
      flushList();
      flushQuote();
      const level = headingMatch[1].length;
      html.push(`<h${level}>${renderInlineMarkdown(headingMatch[2])}</h${level}>`);
      continue;
    }

    if (/^(-(3,)|\*(3,))$/.test(trimmed)) {
      flushParagraph();
      flushList();
      flushQuote();
      html.push("<hr>");
      continue;
    }

    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
    if (quoteMatch) {
      flushParagraph();
      flushList();
      quoteLines.push(quoteMatch[1]);
      continue;
    }
    flushQuote();

    const unorderedMatch = trimmed.match(/^[-*]\s+(.+)$/);
    if (unorderedMatch) {
      flushParagraph();
      if (listType && listType !== "ul") flushList();
      listType = "ul";
      listItems.push(unorderedMatch[1]);
      continue;
    }

    const orderedMatch = trimmed.match(/^\d+\.\s+(.+)$/);
    if (orderedMatch) {
      flushParagraph();
      if (listType && listType !== "ol") flushList();
      listType = "ol";
      listItems.push(orderedMatch[1]);
      continue;
    }

    flushList();
    paragraph.push(trimmed);
  }

  if (inCodeBlock) flushCode();
  flushParagraph();
  flushList();
  flushQuote();
  return html.join("");
}

function rebuildAdjacency(filteredEdges) {
  adjacency.clear();
  for (const node of originalNodes) {
    adjacency.set(node.id, new Set());
  }
  for (const edge of filteredEdges) {
    if (!adjacency.has(edge.from)) adjacency.set(edge.from, new Set());
    if (!adjacency.has(edge.to)) adjacency.set(edge.to, new Set());
    adjacency.get(edge.from).add(edge.to);
    adjacency.get(edge.to).add(edge.from);
  }
}

function currentEdgeState() {
  const minConf = parseInt(controls.confSlider.value, 10) / 100;
  controls.confValue.textContent = minConf.toFixed(2);
  return {
    showExtracted: controls.extracted.checked,
    showInferred: controls.inferred.checked,
    showAmbiguous: controls.ambiguous.checked,
    minConf,
  };
}

function passesEdgeFilters(edge, edgeState) {
  const typeOk = (edge.type === "EXTRACTED" && edgeState.showExtracted)
    || (edge.type === "INFERRED" && edgeState.showInferred)
    || (edge.type === "AMBIGUOUS" && edgeState.showAmbiguous);
  const confOk = (edge.confidence ?? 1.0) >= edgeState.minConf;
  return typeOk && confOk;
}

function searchNodes(q) {
  applyFilters(q, activeNodeId);
}

function clearSelection() {
  activeNodeId = null;
  closeDrawer();
  applyFilters(searchInput.value, null);
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
}

function openDrawer(node, relatedIds) {
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawer-title").textContent = node.label;
  const communityText = Number.isInteger(node.group) && node.group >= 0 ? ` · community ${node.group}` : "";
  document.getElementById("drawer-meta").textContent = `${node.type}${communityText}`;
  document.getElementById("drawer-path").textContent = node.path;
  document.getElementById("drawer-preview").textContent = node.preview || "";
  document.getElementById("drawer-markdown").innerHTML = renderMarkdown(node.markdown || "");

  const relatedList = document.getElementById("drawer-related-list");
  relatedList.innerHTML = "";
  const relatedNodes = originalNodes
    .filter(item => relatedIds.has(item.id) && item.id !== node.id)
    .sort((a, b) => a.label.localeCompare(b.label));

  if (relatedNodes.length === 0) {
    const empty = document.createElement("span");
    empty.textContent = "No directly connected nodes";
    relatedList.appendChild(empty);
    return;
  }

  for (const related of relatedNodes) {
    const chip = document.createElement("button");
    chip.className = "related-chip";
    chip.textContent = related.label;
    chip.onclick = () => focusNode(related.id);
    relatedList.appendChild(chip);
  }
}

function applyFilters(query = searchInput.value, selectedNodeId = activeNodeId) {
  const lower = (query || "").trim().toLowerCase();
  const edgeState = currentEdgeState();
  const filteredEdges = originalEdges.filter(edge => passesEdgeFilters(edge, edgeState));
  rebuildAdjacency(filteredEdges);

  const relatedIds = selectedNodeId
    ? new Set([selectedNodeId, ...(adjacency.get(selectedNodeId) || [])])
    : null;
  const filteredNodeIds = new Set();
  for (const edge of filteredEdges) {
    filteredNodeIds.add(edge.from);
    filteredNodeIds.add(edge.to);
  }

  let visibleNodeCount = 0;
  const nodeUpdates = originalNodes.map(node => {
    const matchesSearch = !lower || node.label.toLowerCase().includes(lower);
    const isActive = selectedNodeId === node.id;
    const isConnected = filteredNodeIds.has(node.id);
    const isRelated = !relatedIds || relatedIds.has(node.id);
    const hidden = !selectedNodeId && !lower && !isConnected;
    const emphasized = matchesSearch && isRelated && (isConnected || !!lower || isActive);

    if (!hidden) {
      visibleNodeCount += 1;
    }

    return {
      id: node.id,
      hidden,
      color: {
        background: emphasized ? node.color : hexToRgba(node.color, hidden ? 0.05 : 0.14),
        border: emphasized ? hexToRgba(node.color, 0.96) : hexToRgba(node.color, hidden ? 0.08 : 0.22),
        highlight: { background: node.color, border: hexToRgba(node.color, 1) },
        hover: { background: node.color, border: hexToRgba(node.color, 1) },
      },
      font: {
        color: emphasized ? "#f2f3f8" : hidden ? "rgba(242,243,248,0.08)" : "rgba(242,243,248,0.2)",
      },
      borderWidth: isActive ? 5 : 2,
      size: isActive ? 18 : 12,
    };
  });

  const edgeUpdates = originalEdges.map(edge => {
    const enabled = passesEdgeFilters(edge, edgeState);
    if (!enabled) {
      return { id: edge.id, hidden: true };
    }

    const matchesSearch = !lower
      || nodeMap.get(edge.from)?.label.toLowerCase().includes(lower)
      || nodeMap.get(edge.to)?.label.toLowerCase().includes(lower);
    const isRelated = !relatedIds || relatedIds.has(edge.from) || relatedIds.has(edge.to);
    const touchesActive = !!selectedNodeId && (edge.from === selectedNodeId || edge.to === selectedNodeId);
    const emphasized = matchesSearch && isRelated;

    return {
      id: edge.id,
      hidden: false,
      width: touchesActive ? 2.8 : emphasized ? 1.2 : 0.6,
      color: emphasized ? edge.color : hexToRgba(edge.color, 0.08),
    };
  });

  nodes.update(nodeUpdates);
  edges.update(edgeUpdates);

  if (selectedNodeId) {
    const activeNode = nodeMap.get(selectedNodeId);
    if (activeNode) {
      openDrawer(activeNode, relatedIds || new Set([selectedNodeId]));
    }
  }

  const focusSuffix = selectedNodeId && nodeMap.get(selectedNodeId)
    ? ` · focused: ${nodeMap.get(selectedNodeId).label}`
    : "";
  stats.textContent = `${visibleNodeCount} nodes · ${filteredEdges.length} edges${focusSuffix}`;
}

const container = document.getElementById("graph");

// Adaptive physics based on graph size
const nodeCount = originalNodes.length;
const gravConst = nodeCount > 80 ? -8000 : nodeCount > 30 ? -5000 : -2000;
const springLen = nodeCount > 80 ? 250 : nodeCount > 30 ? 200 : 150;

const network = new vis.Network(container, { nodes, edges }, {
  nodes: {
    shape: "dot",
    font: { color: "#ddd", size: 12, strokeWidth: 3, strokeColor: "#111" },
    borderWidth: 1.5,
    scaling: {
      min: 8,
      max: 40,
      label: { enabled: true, min: 10, max: 20, drawThreshold: 6, maxVisible: 24 },
    },
  },
  edges: {
    width: 0.8,
    smooth: { type: "continuous" },
    arrows: { to: { enabled: true, scaleFactor: 0.4 } },
    color: { inherit: false },
    hoverWidth: 2,
  },
  physics: {
    stabilization: { iterations: 250, updateInterval: 25, fit: true },
    barnesHut: { gravitationalConstant: gravConst, springLength: springLen, springConstant: 0.02, damping: 0.15 },
    minVelocity: 0.75,
  },
  interaction: { hover: true, tooltipDelay: 150, hideEdgesOnDrag: true, hideEdgesOnZoom: true },
});

// Ensure the graph fits the viewport after physics stabilization
network.once("stabilizationIterationsDone", function () {
  network.fit({ animation: { duration: 400, easingFunction: "easeInOutQuad" } });
});

function focusNode(nodeId) {
  activeNodeId = nodeId;
  applyFilters(searchInput.value, nodeId);
  const node = nodeMap.get(nodeId) || nodes.get(nodeId);
  const relatedIds = new Set([nodeId, ...(adjacency.get(nodeId) || [])]);
  openDrawer(node, relatedIds);
  network.focus(nodeId, {
    scale: 1.1,
    animation: { duration: 300, easingFunction: "easeInOutQuad" },
  });
}

network.on("click", params => {
  if (params.nodes.length > 0) {
    focusNode(params.nodes[0]);
  } else {
    clearSelection();
  }
});

applyFilters();
</script>
</body>
</html>
